<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GYM738" />
  <meta name="theme-color" content="#1e1d1b" />
  <meta name="description" content="Твои тренировки, рабочие веса и прогресс. Простой дневник для зала." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="app.css?v=11" />
  <link rel="stylesheet" href="views.css" />
  <link rel="stylesheet" href="graphite.css?v=11" />
  <link rel="stylesheet" href="rhythm.css" />
  <title>GYM738 — Дневник тренировок</title>
  <script src="views.js?v=11" defer></script>
  <script src="rhythm.js?v=11" defer></script>
  <script src="rhythm-form.js?v=11" defer></script>
  <script src="app.js?v=11" defer></script>
</head>
<body>
  <header class="app-header" id="appHeader">
    <div class="shell">
      <div class="topline">
        <div class="brand">
          <h1 class="production-brand"><svg aria-hidden="true" viewBox="0 0 32 24" fill="currentColor"><path d="M0 22 4 9h6L6 22zm9 0L16 2h6l-7 20zm10 0 5-16h6l-5 16z"/></svg>GYM738</h1>
          <span id="saveStatusBadge" class="save-status" role="status">На этом устройстве</span>
        </div>
        <div class="week-picker">
          <label class="sr-only" for="weekSelect">Неделя тренировок</label>
          <select id="weekSelect" onchange="changeWeek(this.value)"></select>
        </div>
        <button type="button" class="icon-button" onclick="openDataModal()" aria-label="Сохранение и настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 8v.01M12 12v.01M12 16v.01" stroke-linecap="round" stroke-width="3"/><rect x="4" y="3" width="16" height="18" rx="5"/></svg>
        </button>
      </div>
      <nav class="primary-nav" aria-label="Разделы приложения">
        <button type="button" id="nav-workout" onclick="selectTab(lastWorkoutTab)">Тренировка</button>
        <button type="button" id="nav-nutrition" onclick="selectTab('nutrition')">Питание</button>
        <button type="button" id="nav-stats" onclick="selectTab('stats')">Прогресс</button>
      </nav>
    </div>
  </header>

  <main class="shell" id="mainContainer"></main>

  <aside class="timer-dock" id="bottomTimerBar" aria-label="Таймер отдыха">
    <div class="shell">
      <div class="timer-main">
        <button type="button" class="timer-toggle" id="timerToggleBtn" onclick="toggleTimer()" aria-label="Запустить таймер">
          <svg id="timerPlayIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 5l11 7-11 7z"/></svg>
        </button>
        <div class="timer-readout">
          <time id="timerDisplay" aria-label="Осталось времени">02:30</time>
          <p id="timerStatusLabel">Отдых</p>
        </div>
        <button type="button" class="timer-add" onclick="adjustTimer(30)" aria-label="Добавить 30 секунд">+30 с</button>
        <button type="button" id="timerOptionsButton" class="icon-button" onclick="toggleTimerOptions()" aria-label="Выбрать время отдыха" aria-expanded="false" aria-controls="timerOptions">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
      <div id="timerOptions" class="timer-settings" hidden>
        <button type="button" onclick="chooseTimerPreset(90)" data-seconds="90">1:30</button>
        <button type="button" onclick="chooseTimerPreset(120)" data-seconds="120">2:00</button>
        <button type="button" onclick="chooseTimerPreset(150)" data-seconds="150">2:30</button>
        <button type="button" onclick="chooseTimerPreset(180)" data-seconds="180">3:00</button>
      </div>
      <div class="timer-progress" aria-hidden="true"><span id="timerProgressBar"></span></div>
    </div>
  </aside>

  <div id="kbDismissBar" class="keyboard-toolbar" hidden>
    <div class="shell"><button type="button" onpointerdown="dismissKeyboard(event)" onclick="dismissKeyboard(event)">Готово</button></div>
  </div>

  <dialog id="dataModal" aria-labelledby="dataModalTitle">
    <div class="dialog-heading">
      <h2 id="dataModalTitle">Твои данные</h2>
      <button type="button" class="icon-button" onclick="closeDataModal()" aria-label="Закрыть настройки">✕</button>
    </div>
    <p class="dialog-copy">Записи хранятся на этом устройстве и доступны офлайн. Сохраняй копию для переноса дневника или восстановления после очистки браузера.</p>
    <div class="dialog-actions">
      <button type="button" onclick="exportJSON()">Сохранить резервную копию</button>
      <button type="button" onclick="document.getElementById('importFile').click()">Восстановить из копии</button>
      <input type="file" id="importFile" accept=".json,application/json" onchange="importJSON(event)" hidden aria-label="Файл резервной копии" />
      <button type="button" onclick="exportCSV()">Экспортировать в Excel · CSV</button>
      <button type="button" onclick="forceAppUpdate()">Проверить обновление</button>
      <button type="button" class="danger" onclick="resetAllData()">Удалить все записи</button>
    </div>
  </dialog>
  <dialog id="rhythmSetDialog" aria-labelledby="rhythmSetTitle" aria-describedby="rhythmSetStep">
    <form id="rhythmSetForm" novalidate>
      <header><h2 id="rhythmSetTitle" tabindex="-1">Запись подхода</h2><button id="rhythmClose" type="button" aria-label="Закрыть">×</button></header>
      <p id="rhythmSetStep"></p>
      <p id="rhythmSetPlan"></p>
      <label id="rhythmVariantField">Вариант упражнения<select id="rhythmVariant"></select></label>
      <div class="rhythm-fields">
        <label>Вес, кг<input id="rhythmWeight" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="—"></label>
        <label>Повторы<input id="rhythmReps" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" required></label>
      </div>
      <label>Повторов в запасе<select id="rhythmEffort">
        <option value="">Не отмечено</option><option value="0">0 · до отказа</option>
        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4+">4 и больше</option>
      </select></label>
      <details id="rhythmTechnique"><summary>Техника и моя заметка</summary>
        <ul class="technique"></ul><label>Заметка к упражнению на эту неделю<textarea id="rhythmNote" rows="2" placeholder="Например, высота сиденья"></textarea></label>
      </details>
      <p id="rhythmSetError" role="alert" hidden></p>
      <button id="rhythmPrevious" type="button" hidden></button>
      <button id="rhythmSubmit" type="submit">Записать подход</button>
      <button id="rhythmUndo" type="button" hidden>Снять отметку о выполнении</button>
    </form>
  </dialog>
</body>
</html>
