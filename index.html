<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GYM738" />
  <meta name="theme-color" content="#090d16" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>GYM738 — Дневник тренировок</title>
  <script src="tailwind.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overscroll-behavior-y: none;
      margin: 0;
      padding: 0;
    }
    body {
      padding-bottom: calc(8.5rem + max(var(--safe-bottom), 24px));
    }

    /* Учет брови / Dynamic Island iPhone 14 (47–59px) */
    .ios-header {
      padding-top: max(calc(var(--safe-top) + 6px), 14px);
    }
    @media all and (display-mode: standalone) {
      .ios-header {
        padding-top: max(calc(var(--safe-top) + 8px), 54px);
      }
    }

    /* Учет нижней полоски Home Indicator на iPhone 14 */
    .ios-bottom-bar {
      padding-bottom: max(calc(var(--safe-bottom) + 6px), 12px);
    }
    @media all and (display-mode: standalone) {
      .ios-bottom-bar {
        padding-bottom: max(calc(var(--safe-bottom) + 4px), 26px);
      }
    }

    /* Отключаем авто-зум Safari при фокусе на поле ввода (обязательно >= 16px) */
    input, select, textarea {
      font-size: 16px !important;
      -webkit-appearance: none;
      appearance: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .set-done {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.18) 0%, rgba(16, 185, 129, 0.05) 100%) !important;
      border-color: rgba(16, 185, 129, 0.45) !important;
    }

    /* Плавное нажатие в стиле iOS */
    .ios-btn:active {
      transform: scale(0.94);
      opacity: 0.85;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-slate-950">

  <!-- Плавающая кнопка закрытия клавиатуры на iPhone (появляется только когда открыта клавиатура) -->
  <div id="kbDismissBar" class="fixed top-0 inset-x-0 z-50 hidden pointer-events-none flex justify-end px-3" style="padding-top: max(calc(env(safe-area-inset-top, 47px) + 6px), 52px);">
    <button type="button" onmousedown="dismissKeyboard(event)" ontouchstart="dismissKeyboard(event)" class="pointer-events-auto px-3.5 py-1.5 rounded-full bg-emerald-500 text-slate-950 font-extrabold text-xs shadow-xl shadow-black/60 flex items-center gap-1.5 active:scale-95">
      <span>Готово</span>
      <span>⌨️↓</span>
    </button>
  </div>

  <!-- Top Sticky Header (iPhone 14 Safe Area) -->
  <header class="ios-header sticky top-0 z-30 bg-[#090d16]/95 backdrop-blur-xl border-b border-slate-800/80 px-3.5 pb-2.5">
    <div class="max-w-lg mx-auto">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 shrink-0 rounded-xl bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-extrabold text-sm">
            UL
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 class="text-[15px] font-extrabold tracking-tight text-white leading-none">GYM738</h1>
              <span id="saveStatusBadge" class="px-1.5 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-[10px] font-semibold text-emerald-400">✓ Сохранено</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5 truncate">183 см • <span id="headerCurrentWeight">73.0</span> кг • Двойная прогрессия</p>
          </div>
        </div>

        <!-- Выбор недели и меню бэкапа -->
        <div class="flex items-center gap-1.5 shrink-0">
          <div class="relative">
            <select id="weekSelect" onchange="changeWeek(this.value)" class="bg-slate-800/95 text-white font-bold rounded-xl pl-2.5 pr-6 py-1.5 border border-slate-700 focus:outline-none focus:border-emerald-500 h-9">
            </select>
            <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]">▼</span>
          </div>
          <button onclick="openDataModal()" title="Бэкап и настройки" class="ios-btn w-9 h-9 rounded-xl bg-slate-800/95 border border-slate-700 text-slate-300 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Дни тренировок (крупные кнопки под палец) -->
      <div class="grid grid-cols-6 gap-1 bg-slate-900/90 p-1 rounded-2xl border border-slate-800/90" id="dayTabs">
        <button onclick="selectTab('upperA')" id="tab-upperA" class="ios-btn py-2 rounded-xl text-[11px] font-bold text-center transition truncate">
          Верх А
        </button>
        <button onclick="selectTab('lowerA')" id="tab-lowerA" class="ios-btn py-2 rounded-xl text-[11px] font-bold text-center transition truncate">
          Низ А
        </button>
        <button onclick="selectTab('upperB')" id="tab-upperB" class="ios-btn py-2 rounded-xl text-[11px] font-bold text-center transition truncate">
          Верх Б
        </button>
        <button onclick="selectTab('lowerB')" id="tab-lowerB" class="ios-btn py-2 rounded-xl text-[11px] font-bold text-center transition truncate">
          Низ Б
        </button>
        <button onclick="selectTab('nutrition')" id="tab-nutrition" class="ios-btn py-2 rounded-xl text-[11px] font-bold text-center transition truncate">
          ⚖️ КБЖУ
        </button>
        <button onclick="selectTab('stats')" id="tab-stats" class="ios-btn py-2 rounded-xl text-[11px] font-bold text-center transition truncate">
          📈 Итог
        </button>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="max-w-lg mx-auto px-3 pt-3" id="mainContainer">
  </main>

  <!-- Нижний бар таймера отдыха (адаптирован под большой палец и полоску Home на iPhone 14) -->
  <div id="bottomTimerBar" class="ios-bottom-bar fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/90 px-3.5 pt-2.5 shadow-2xl transition-colors duration-300">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <button id="timerToggleBtn" onclick="toggleTimer()" class="ios-btn w-11 h-11 rounded-2xl bg-emerald-500 text-slate-950 font-extrabold flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg id="timerPlayIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
          </svg>
        </button>
        <div onclick="toggleTimer()" class="cursor-pointer">
          <div class="flex items-baseline gap-1.5">
            <span id="timerDisplay" class="font-mono text-xl font-extrabold text-white tabular-nums tracking-tight">02:30</span>
            <span id="timerStatusLabel" class="text-[11px] font-medium text-slate-400">Отдых</span>
          </div>
          <div class="w-28 h-1.5 bg-slate-800 rounded-full overflow-hidden mt-0.5">
            <div id="timerProgressBar" class="h-full bg-emerald-400 transition-all duration-300" style="width: 100%"></div>
          </div>
        </div>
      </div>

      <!-- Быстрый выбор времени отдыха -->
      <div class="flex items-center gap-1">
        <button onclick="setTimerPreset(90)" class="ios-btn px-2.5 py-2 rounded-xl bg-slate-800 text-[11px] font-bold text-slate-300">1:30</button>
        <button onclick="setTimerPreset(120)" class="ios-btn px-2.5 py-2 rounded-xl bg-slate-800 text-[11px] font-bold text-slate-300">2:00</button>
        <button onclick="setTimerPreset(150)" class="ios-btn px-2.5 py-2 rounded-xl bg-slate-800 text-[11px] font-bold text-slate-300">2:30</button>
        <button onclick="setTimerPreset(180)" class="ios-btn px-2.5 py-2 rounded-xl bg-slate-800 text-[11px] font-bold text-slate-300">3:00</button>
        <button onclick="adjustTimer(30)" class="ios-btn px-2 py-2 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-[11px] font-extrabold text-emerald-400">+30с</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно бэкапа -->
  <div id="dataModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-5 space-y-3.5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Сохранение и данные</h3>
        <button onclick="closeDataModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">✕</button>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">
        Твои записи мгновенно сохраняются в память Айфона (<code class="text-emerald-400">localStorage + IndexedDB</code>). Даже без интернета и при обновлениях дизайна они <b>не стираются</b>.
      </p>
      <div class="grid grid-cols-1 gap-2.5">
        <button onclick="exportCSV()" class="ios-btn w-full py-3 px-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center justify-center gap-2">
          📊 Выгрузить таблицу (.CSV для Excel)
        </button>
        <button onclick="exportJSON()" class="ios-btn w-full py-3 px-4 rounded-2xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center gap-2">
          💾 Сохранить бэкап (.JSON) на Айфон
        </button>
        <label class="ios-btn w-full py-3 px-4 rounded-2xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer">
          📂 Загрузить бэкап (.JSON)
          <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
        </label>
        <button onclick="forceAppUpdate()" class="ios-btn w-full py-2.5 px-4 rounded-2xl bg-sky-500/15 border border-sky-500/30 text-sky-300 text-xs font-semibold flex items-center justify-center gap-2">
          🔄 Обновить версию (записи сохранятся)
        </button>
        <button onclick="resetAllData()" class="ios-btn w-full py-2.5 px-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium mt-1">
          Очистить все записи
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. ПРОГРАММА ТРЕНИРОВОК (UPPER / LOWER)
    // ==========================================
    const PROGRAM = {
      upperA: {
        id: 'upperA',
        title: 'Пн • Верх А (Базовая сила)',
        subtitle: 'Толщина спины, жимовая база и длинные головки рук',
        warmupNote: 'Разминка: 2–3 подхода перед первым упражнением на мышцу без утомления.',
        exercises: [
          {
            id: 'ua_bench',
            name: 'Жим штанги лежа на горизонтальной скамье',
            sets: 3,
            minReps: 5,
            maxReps: 8,
            rir: 'RIR 2',
            restSec: 180,
            restLabel: '3 мин',
            muscle: 'Грудь',
            step: 2.5,
            note: 'СОЛО (183 см): ставь скамью в раму с упорами на 2 см ниже груди с мостом (или жми без замков на строгом RIR 2). Локти под углом 45–60° к корпусу, лопатки сведены.'
          },
          {
            id: 'ua_row',
            name: 'Тяга Т-грифа с упором грудью / Тяга штанги',
            variants: ['Тяга Т-грифа с упором грудью ✅', 'Тяга штанги в наклоне'],
            sets: 3,
            minReps: 6,
            maxReps: 10,
            rir: 'RIR 1–2',
            restSec: 150,
            restLabel: '2.5 мин',
            muscle: 'Спина',
            step: 2.5,
            note: 'СОЛО (183 см): упор грудью — лучший выбор, он бережет поясницу перед днем ног. Внизу позволяй весу вытянуть лопатки вперед (растяжение), затем мощно тяни локти назад.'
          },
          {
            id: 'ua_ohp_db',
            name: 'Жим гантелей сидя (угол скамьи 75–80°)',
            sets: 3,
            minReps: 8,
            maxReps: 10,
            rir: 'RIR 1–2',
            restSec: 150,
            restLabel: '2.5 мин',
            muscle: 'Плечи',
            step: 2,
            note: 'СОЛО: закидывай гантели поочередно толчком колен. Локти выведи вперед на 30–45° (не в линию с ушами!). Опускай глубоко до плеч. В конце прими гантели обратно на колени (не бросай на пол!).'
          },
          {
            id: 'ua_lat_pulldown',
            name: 'Тяга верхнего блока к груди',
            variants: ['Средний хват к груди ✅', 'Широкий хват к груди'],
            sets: 3,
            minReps: 8,
            maxReps: 12,
            rir: 'RIR 1',
            restSec: 120,
            restLabel: '2 мин',
            muscle: 'Широчайшие',
            step: 2.5,
            note: 'СОЛО: используй лямки! Хват чуть шире плеч дает лучшую амплитуду. Вверху позволяй лопаткам тянуться за рукоятью вверх (растяжение широчайших).'
          },
          {
            id: 'ua_incline_curl',
            name: 'Сгибания на бицепс: Наклонная скамья / Блок',
            variants: ['Гантели сидя на наклонной 45–60° ✅', 'Нижний блок стоя спиной'],
            sets: 3,
            minReps: 8,
            maxReps: 12,
            rir: 'RIR 0–1',
            restSec: 90,
            restLabel: '1.5 мин',
            muscle: 'Бицепс',
            step: 1,
            note: 'ПРОСТАЯ ТЕХНИКА: сидя на скамье 45–60°, прижми лопатки и затылок, свесь руки вертикально вниз — бицепс уже растянут без возни с тросом! Сгибай руки, не выводя локти вперед.'
          },
          {
            id: 'ua_overhead_ext',
            name: 'Разгибания на трицепс из-за головы',
            variants: ['Блок с канатом (ролик у пояса) ✅', 'С гантелью сидя двумя руками'],
            sets: 3,
            minReps: 10,
            maxReps: 12,
            rir: 'RIR 0–1',
            restSec: 90,
            restLabel: '1.5 мин',
            muscle: 'Трицепс',
            step: 2.5,
            note: 'ЧТОБЫ БЫЛО УДОБНО: на блоке ставь ролик на высоту ПОЯСА (не в пол!), бери канат и разворачивайся. Либо сядь на скамью 75° и делай из-за головы с одной гантелью двумя руками!'
          }
        ]
      },
      lowerA: {
        id: 'lowerA',
        title: 'Вт • Низ А (Квадрицепс и база)',
        subtitle: 'Глубокий присед, румынская тяга и бицепс бедра сидя',
        warmupNote: 'Разомни колени и таз + 2–3 разминочных подхода в приседаниях.',
        exercises: [
          {
            id: 'la_squat',
            name: 'Глубокий Гакк-присед / Присед со штангой',
            variants: ['Глубокий Гакк-присед ✅', 'Приседания со штангой в раме'],
            sets: 3,
            minReps: 5,
            maxReps: 8,
            rir: 'RIR 2',
            restSec: 210,
            restLabel: '3.5 мин',
            muscle: 'Квадрицепс',
            step: 2.5,
            note: 'СОЛО (183 см): Гакк-присед идеален — спина прижата, стопоры под руками. Если со штангой — ставь упоры в раме и подложи блинчики 1.25–2.5 кг под пятки для глубокого седа с ровной спиной.'
          },
          {
            id: 'la_rdl',
            name: 'Румынская тяга со штангой (с лямками)',
            sets: 3,
            minReps: 8,
            maxReps: 10,
            rir: 'RIR 2',
            restSec: 180,
            restLabel: '3 мин',
            muscle: 'Бицепс бедра',
            step: 2.5,
            note: 'СОЛО: снимай штангу со стоек на уровне бедер и обязательно надевай лямки! Колени чуть согнуты, уводи таз строго назад (штанга скользит по ногам до середины голени).'
          },
          {
            id: 'la_leg_press',
            name: 'Жим ногами (стопы внизу платформы)',
            sets: 3,
            minReps: 10,
            maxReps: 12,
            rir: 'RIR 1',
            restSec: 150,
            restLabel: '2.5 мин',
            muscle: 'Квадрицепс',
            step: 5,
            note: 'СОЛО: проверь нижние страховочные отбойники! Ставь стопы в нижнюю часть платформы. Опускай максимально глубоко, но не отрывай крестец и поясницу от сиденья.'
          },
          {
            id: 'la_seated_curl',
            name: 'Сгибания ног в тренажере СИДЯ',
            sets: 3,
            minReps: 10,
            maxReps: 15,
            rir: 'RIR 0–1',
            restSec: 120,
            restLabel: '2 мин',
            muscle: 'Бицепс бедра',
            step: 2.5,
            note: 'СОЛО: плотно зажми бедра верхней подушкой. Сидячий вариант дает на 30–40% больше роста, чем лежа. В 3-м подходе после отказа сделай 3–4 частичных повторения в начале амплитуды.'
          },
          {
            id: 'la_calf_standing',
            name: 'Подъемы на носки стоя (тренажер / Смит)',
            sets: 4,
            minReps: 10,
            maxReps: 15,
            rir: 'RIR 0–1',
            restSec: 90,
            restLabel: '1.5 мин',
            muscle: 'Икры',
            step: 2.5,
            note: 'Главный секрет икр: опусти пятки максимально вниз и держи паузу 2 секунды в нижней точке (убирает пружину ахиллова сухожилия).'
          },
          {
            id: 'la_abs',
            name: 'Скручивания «Молитва» / Подъемы ног в висе',
            variants: ['Скручивания на блоке («Молитва») ✅', 'Подъемы ног в висе'],
            sets: 3,
            minReps: 10,
            maxReps: 15,
            rir: 'RIR 1',
            restSec: 90,
            restLabel: '1.5 мин',
            muscle: 'Пресс',
            step: 2.5,
            note: 'В «Молитве» зафиксируй таз и скручивай именно грудной отдел позвоночника к тазу (ребра к лобковой кости), плавно растягивая пресс вверху.'
          }
        ]
      },
      upperB: {
        id: 'upperB',
        title: 'Чт • Верх Б (Гипертрофия)',
        subtitle: 'Верх груди, ширина спины и средняя дельта в растяжении',
        warmupNote: '2–3 разминочных подхода перед жимом и подтягиваниями.',
        exercises: [
          {
            id: 'ub_incline_db',
            name: 'Жим гантелей на наклонной скамье (30°)',
            sets: 3,
            minReps: 8,
            maxReps: 10,
            rir: 'RIR 1–2',
            restSec: 165,
            restLabel: '2.5–3 мин',
            muscle: 'Верх груди',
            step: 2,
            note: 'СОЛО: угол строго 30° (1–2 деления вверх). Закидывай гантели коленями, локти под углом 45–60° к ребрам. Опускай глубоко с паузой 0.5 сек в растяжении. В конце прими гантели на колени и сядь.'
          },
          {
            id: 'ub_pullups',
            name: 'Подтягивания (с доп. весом или своим)',
            sets: 3,
            minReps: 6,

    // ==========================================
    // 2. ХРАНИЛИЩЕ (100% СОВМЕСТИМОСТЬ С УЖЕ ВВЕДЕННЫМИ ДАННЫМИ)
    // ==========================================
    const STORAGE_KEY = 'gym738_tracker_v1';
    const IDB_NAME = 'gym738_idb';
    const IDB_STORE = 'state_store';
    let state = loadState();
    let openTips = {};       // какие подсказки 💡 открыты
    let manualExpand = {};   // какие выполненные карточки развернуты вручную

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    function openIDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject('No IDB');
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e);
      });
    }

    function saveToIDB(data) {
      openIDB().then(db => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(JSON.stringify(data), STORAGE_KEY);
      }).catch(() => {});
    }

    function restoreFromIDBIfNeeded() {
      openIDB().then(db => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
        req.onsuccess = () => {
          if (req.result && !localStorage.getItem(STORAGE_KEY)) {
            try {
              state = Object.assign(getDefaultState(), JSON.parse(req.result));
              localStorage.setItem(STORAGE_KEY, req.result);
              initWeekSelect();
              render();
            } catch (e) {}
          }
        };
      }).catch(() => {});
    }

    function getDefaultState() {
      return {
        currentWeek: 1,
        currentTab: 'upperA',
        selectedVariants: {},
        workouts: {},
        notes: {},
        bodyWeight: {},
        dailyChecklist: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        return Object.assign(getDefaultState(), JSON.parse(raw));
      } catch (e) {
        return getDefaultState();
      }
    }

    let saveFlashTimeout = null;
    function saveState() {
      try {
        const serialized = JSON.stringify(state);
        localStorage.setItem(STORAGE_KEY, serialized);
        saveToIDB(state);
        const badge = document.getElementById('saveStatusBadge');
        if (badge) {
          badge.textContent = '💾 Сохранено';
          badge.className = 'px-1.5 py-0.5 rounded-md bg-emerald-500 text-slate-950 text-[10px] font-bold transition';
          clearTimeout(saveFlashTimeout);
          saveFlashTimeout = setTimeout(() => {
            badge.textContent = '✓ Сохранено';
            badge.className = 'px-1.5 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-[10px] font-semibold text-emerald-400 transition';
          }, 800);
        }
      } catch (e) {
        console.error('Save error', e);
      }
      updateHeaderWeight();
    }

    function getSetData(week, exId, setIdx) {
      const key = `w${week}_${exId}_s${setIdx}`;
      return state.workouts[key] || { weight: '', reps: '', done: false };
    }

    function setSetData(week, exId, setIdx, patch) {
      const key = `w${week}_${exId}_s${setIdx}`;
      const current = getSetData(week, exId, setIdx);
      state.workouts[key] = Object.assign({}, current, patch);
      saveState();
    }

    function getRepRange(ex) {
      const variantIdx = state.selectedVariants[ex.id] || 0;
      if (ex.id === 'lb_main' && variantIdx === 1) {
        return { min: ex.altMinReps, max: ex.altMaxReps };
      }
      return { min: ex.minReps, max: ex.maxReps };
    }

    // Нормализация ввода для русской клавиатуры iPhone (заменяет запятую "," на точку ".")
    function cleanDecimal(val) {
      if (val === undefined || val === null) return '';
      return String(val).replace(',', '.').replace(/[^0-9.]/g, '');
    }

    // Управление плавающей кнопкой закрытия клавиатуры на iOS
    document.addEventListener('focusin', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        const bar = document.getElementById('kbDismissBar');
        if (bar) bar.classList.remove('hidden');
      }
    });
    document.addEventListener('focusout', () => {
      setTimeout(() => {
        const active = document.activeElement;
        if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')) {
          const bar = document.getElementById('kbDismissBar');
          if (bar) bar.classList.add('hidden');
        }
      }, 100);
    });

    function dismissKeyboard(e) {
      if (e) e.preventDefault();
      if (document.activeElement) document.activeElement.blur();
      const bar = document.getElementById('kbDismissBar');
      if (bar) bar.classList.add('hidden');
    }

    // ==========================================
    // 3. АЛГОРИТМ ДВОЙНОЙ ПРОГРЕССИИ
    // ==========================================
    function evaluateProgression(week, ex) {
      const range = getRepRange(ex);
      const isDeload = (week % 8 === 0);

      if (isDeload) {
        return {
          type: 'deload',
          badge: '🔄 DELOAD НЕДЕЛЯ (-15..20% веса)',
          color: 'text-sky-300 bg-sky-500/15 border-sky-500/30'
        };
      }

      let curSets = [];
      for (let s = 1; s <= ex.sets; s++) {
        curSets.push(getSetData(week, ex.id, s));
      }
      const filledCur = curSets.filter(s => s.reps !== '' && Number(s.reps) > 0);

      if (filledCur.length === ex.sets && filledCur.every(s => Number(s.reps) >= range.max)) {
        const w = Number(cleanDecimal(filledCur[0].weight)) || 0;
        const step = ex.step || 2.5;
        const nextW = w > 0 ? ` (${w + step} кг)` : '';
        return {
          type: 'levelup',
          badge: `🚀 ВЕРХ ЗАКРЫТ! След. тренировка: +вес${nextW}`,
          color: 'text-emerald-300 bg-emerald-500/20 border-emerald-500/40'
        };
      }

      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;
      if (prevWeek >= 1) {
        let prevSets = [];
        for (let s = 1; s <= ex.sets; s++) {
          prevSets.push(getSetData(prevWeek, ex.id, s));
        }
        const filledPrev = prevSets.filter(s => s.reps !== '' && Number(s.reps) > 0);
        if (filledPrev.length > 0) {
          const prevAllMax = filledPrev.length === ex.sets && filledPrev.every(s => Number(s.reps) >= range.max);
          const prevWeight = filledPrev[0].weight || '?';
          const prevRepsStr = prevSets.map(s => s.reps || '—').join(', ');
          const step = ex.step || 2.5;

          if (prevAllMax) {
            const suggestedWeight = Number(cleanDecimal(prevWeight)) ? (Number(cleanDecimal(prevWeight)) + step) : '';
            return {
              type: 'increase_weight_now',
              badge: `🔥 ПОВЫШАЙ ВЕС СЕГОДНЯ (${suggestedWeight ? suggestedWeight + ' кг' : '+' + step + ' кг'})`,
              color: 'text-amber-300 bg-amber-500/20 border-amber-500/40'
            };
          } else {
            return {
              type: 'add_rep',
              badge: `🎯 Цель: +1 повтор (Прошлый: ${prevWeight} кг × ${prevRepsStr})`,
              color: 'text-indigo-300 bg-indigo-500/15 border-indigo-500/30'
            };
          }
        }
      }

      return {
        type: 'start',
        badge: `Цель: ${ex.sets} подхода × ${range.min}–${range.max} повт. (${ex.rir})`,
        color: 'text-slate-300 bg-slate-800/90 border-slate-700'
      };
    }

    // ==========================================
    // 4. РЕНДЕРИНГ ИНТЕРФЕЙСА ПОД IPHONE 14
    // ==========================================
    function initWeekSelect() {
      const sel = document.getElementById('weekSelect');
      sel.innerHTML = '';
      for (let w = 1; w <= 16; w++) {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = (w % 8 === 0) ? `Неделя ${w} (Deload)` : `Неделя ${w}`;
        if (w === Number(state.currentWeek)) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function changeWeek(val) {
      state.currentWeek = Number(val);
      saveState();
      render();
    }

    function selectTab(tabId) {
      state.currentTab = tabId;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectVariant(exId, idx) {
      state.selectedVariants[exId] = Number(idx);
      saveState();
      render();
    }

    function toggleTip(exId) {
      openTips[exId] = !openTips[exId];
      render();
    }

    function updateHeaderWeight() {
      const weights = Object.values(state.bodyWeight).filter(v => v && Number(cleanDecimal(v)) > 0).map(v => Number(cleanDecimal(v)));
      const el = document.getElementById('headerCurrentWeight');
      if (el) {
        el.textContent = weights.length > 0 ? weights[weights.length - 1].toFixed(1) : '73.0';
      }
    }

    function renderTabs() {
      const tabs = ['upperA', 'lowerA', 'upperB', 'lowerB', 'nutrition', 'stats'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (!btn) return;
        if (t === state.currentTab) {
          btn.className = 'ios-btn py-2 rounded-xl text-[11px] font-extrabold text-center bg-emerald-500 text-slate-950 shadow-sm shadow-emerald-500/30 transition truncate';
        } else {
          btn.className = 'ios-btn py-2 rounded-xl text-[11px] font-semibold text-center text-slate-400 active:bg-slate-800 transition truncate';
        }
      });
    }

    function renderWorkoutDay(dayKey) {
      const day = PROGRAM[dayKey];
      const week = Number(state.currentWeek);
      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;

      let totalSets = 0;
      let doneSets = 0;
      let totalVolume = 0;
      day.exercises.forEach(ex => {
        for (let s = 1; s <= ex.sets; s++) {
          totalSets++;
          const d = getSetData(week, ex.id, s);
          if (d.done) doneSets++;
          const wNum = Number(cleanDecimal(d.weight));
          const rNum = Number(d.reps);
          if (wNum > 0 && rNum > 0) {
            totalVolume += wNum * rNum;
          }
        }
      });

      const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;

      let html = `
        <!-- Компактная сводка дня -->
        <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 mb-3 shadow-lg">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="text-[15px] font-extrabold text-white leading-tight">${day.title}</h2>
              <p class="text-[11px] text-slate-400 mt-0.5">${day.subtitle}</p>
            </div>
            <div class="text-right shrink-0">
              <span class="text-xs font-mono font-extrabold text-emerald-400">${doneSets}/${totalSets} сетов</span>
              <div class="text-[11px] text-slate-400">Тоннаж: <b class="text-slate-200">${Math.round(totalVolume).toLocaleString('ru-RU')} кг</b></div>
            </div>
          </div>
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-2">
            <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${pct}%"></div>
          </div>
        </div>

        <div class="space-y-3">
      `;

      day.exercises.forEach((ex, idx) => {
        const range = getRepRange(ex);
        const prog = evaluateProgression(week, ex);
        const variantIdx = state.selectedVariants[ex.id] || 0;
        const displayName = ex.variants ? ex.variants[variantIdx] : ex.name;
        const tipOpen = !!openTips[ex.id];

        // Проверяем, сколько сетов выполнено в этом упражнении
        let exDoneCount = 0;
        for (let s = 1; s <= ex.sets; s++) {
          if (getSetData(week, ex.id, s).done) exDoneCount++;
        }
        const allExDone = (exDoneCount === ex.sets);

        html += `
          <div class="bg-slate-900/95 border ${allExDone ? 'border-emerald-500/40' : 'border-slate-800/90'} rounded-2xl p-3.5 shadow-md transition" id="card-${ex.id}">
            <!-- Шапка упражнения -->
            <div class="flex items-start justify-between gap-2 mb-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-1.5 py-0.5 rounded-md ${allExDone ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-emerald-400 border border-slate-700'} text-[10px] font-extrabold">
                    ${allExDone ? '✓ #' + (idx + 1) : '#' + (idx + 1)}
                  </span>
                  <span class="text-[11px] font-semibold text-slate-400">${ex.muscle}</span>
                  <span class="text-[11px] text-slate-600">•</span>
                  <button type="button" onclick="setTimerPreset(${ex.restSec}, true)" class="ios-btn text-[11px] font-bold text-sky-400 flex items-center gap-0.5">
                    ⏱ ${ex.restLabel}
                  </button>
                  <button type="button" onclick="toggleTip('${ex.id}')" class="ios-btn ml-auto px-2 py-0.5 rounded-lg bg-slate-800/90 border border-slate-700/80 text-[10px] font-semibold text-slate-300">
                    💡 Техника
                  </button>
                </div>
                <h3 class="text-[15px] font-bold text-white mt-1 leading-snug">${displayName}</h3>
              </div>
              <div class="text-right shrink-0">
                <span class="inline-block px-2 py-0.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-mono font-bold text-white">
                  ${ex.sets} × ${range.min}–${range.max}
                </span>
                <div class="text-[10px] font-bold text-amber-400/90 mt-0.5">${ex.rir}</div>
              </div>
            </div>

            <!-- Переключатель альтернативных упражнений -->
            ${ex.variants ? `
              <div class="flex gap-1 mb-2.5 bg-slate-950/90 p-1 rounded-xl border border-slate-800/80">
                ${ex.variants.map((v, vIdx) => `
                  <button type="button" onclick="selectVariant('${ex.id}', ${vIdx})" class="ios-btn flex-1 py-1.5 px-2 rounded-lg text-[11px] font-semibold transition truncate ${variantIdx === vIdx ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-400'}">
                    ${v}
                  </button>
                `).join('')}
              </div>
            ` : ''}

            <!-- Сворачиваемая подсказка по технике (не засоряет экран на iPhone) -->
            ${tipOpen ? `
              <p class="text-xs text-slate-300 leading-relaxed mb-2.5 bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800">
                💡 ${ex.note}
              </p>
            ` : ''}

            <!-- Плашка двойной прогрессии -->

            <div class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400 px-1 mb-1">
              <div class="w-5 text-center">#</div>

              <div class="w-[42px] text-center">ОК</div>
            </div>

            <!-- Строки подходов -->
            <div class="space-y-2">
        `;

        for (let s = 1; s <= ex.sets; s++) {
          const cur = getSetData(week, ex.id, s);
          const prev = prevWeek >= 1 ? getSetData(prevWeek, ex.id, s) : { weight: '', reps: '' };
          const hasPrev = prev.weight !== '' || prev.reps !== '';
          const prevText = hasPrev ? `${prev.weight || 0}×${prev.reps || 0}` : '—';

          const set1 = getSetData(week, ex.id, 1);
          const weightPlaceholder = prev.weight !== '' ? prev.weight : (set1.weight !== '' ? set1.weight : 'кг');
          const repsPlaceholder = prev.reps !== '' ? prev.reps : `${range.min}-${range.max}`;

          const isTopRep = cur.reps !== '' && Number(cur.reps) >= range.max;

          html += `

                  value="${cur.weight}"
                  oninput="onSetInput(${week}, '${ex.id}', ${s}, 'weight', this.value)"
                  onkeydown="if(event.key==='Enter') this.blur()"

        const noteKey = `w${week}_${ex.id}`;

    function onSetInput(week, exId, setIdx, field, rawValue) {
      const value = field === 'weight' ? cleanDecimal(rawValue) : rawValue.replace(/[^0-9]/g, '');
      setSetData(week, exId, setIdx, { [field]: value });

      // Авто-подстановка рабочего веса из 1-го подхода в пустые подходы 2..N
      if (field === 'weight' && setIdx === 1 && value !== '') {
        const day = PROGRAM[state.currentTab];
        const ex = day && day.exercises.find(e => e.id === exId);
        if (ex) {
          for (let s = 2; s <= ex.sets; s++) {
            const other = getSetData(week, exId, s);
            const inpEl = document.getElementById(`inp-w-${exId}-${s}`);
            if (inpEl && other.weight === '') {
              inpEl.placeholder = value;
            }
          }
        }
      }

      const day = PROGRAM[state.currentTab];
      if (day) {
        const ex = day.exercises.find(e => e.id === exId);
        if (ex) {
          const prog = evaluateProgression(week, ex);
          const progEl = document.getElementById(`prog-${ex.id}`);
          if (progEl) {
            progEl.className = `mb-2.5 px-3 py-1.5 rounded-xl border text-[11px] font-bold flex items-center justify-between gap-2 ${prog.color}`;
            progEl.innerHTML = `<span>${prog.badge}</span>`;
          }
        }
      }
    }

    // Быстрое изменение повторов кнопками - / + без открытия клавиатуры
    function stepRep(week, exId, setIdx, delta, defaultMin) {
      const cur = getSetData(week, exId, setIdx);
      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;
      const prev = prevWeek >= 1 ? getSetData(prevWeek, exId, setIdx) : { weight: '', reps: '' };
      const set1 = getSetData(week, exId, 1);

      let baseRep = cur.reps !== '' ? Number(cur.reps) : (prev.reps !== '' ? Number(prev.reps) : defaultMin);
      let nextRep = Math.max(0, baseRep + delta);

      let nextWeight = cur.weight;
      if (nextWeight === '') {
        if (set1.weight !== '') nextWeight = set1.weight;
        else if (prev.weight !== '') nextWeight = prev.weight;
      }

      setSetData(week, exId, setIdx, {
        weight: nextWeight,
        reps: String(nextRep)
      });
      render();
    }

    function onNoteInput(noteKey, value) {
      state.notes[noteKey] = value;
      saveState();
    }

    function copyFromPrev(week, exId, setIdx, prevWeight, prevReps) {
      if (!prevWeight && !prevReps) return;
      setSetData(week, exId, setIdx, {
        weight: prevWeight,
        reps: prevReps
      });
      render();
    }

    function toggleSetDone(week, exId, setIdx, restSec) {
      dismissKeyboard();
      unlockAudio();

      const cur = getSetData(week, exId, setIdx);
      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;
      const prev = prevWeek >= 1 ? getSetData(prevWeek, exId, setIdx) : { weight: '', reps: '' };
      const set1 = getSetData(week, exId, 1);

      let nextWeight = cur.weight;
      let nextReps = cur.reps;

      if (nextWeight === '') {
        if (set1.weight !== '') nextWeight = set1.weight;
        else if (prev.weight !== '') nextWeight = prev.weight;
      }
      if (nextReps === '' && prev.reps !== '') {
        nextReps = prev.reps;
      }

      const nextDone = !cur.done;
      setSetData(week, exId, setIdx, {
        weight: nextWeight,
        reps: nextReps,
        done: nextDone
      });

      if (nextDone) {
        setTimerPreset(restSec, true);
      }
      render();
    }

    // ==========================================
    // 7. ТАЙМЕР ОТДЫХА СО ЗВУКОМ (АДАПТИРОВАН ПОД IOS)
    // ==========================================
    let timerTotal = 150;
    let timerRemaining = 150;
    let timerInterval = null;
    let timerEndTime = null;
    let sharedAudioCtx = null;

    function unlockAudio() {
      try {
        if (!sharedAudioCtx) {
          sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume();
        }
      } catch (e) {}
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      const disp = document.getElementById('timerDisplay');
      const bar = document.getElementById('timerProgressBar');
      const lbl = document.getElementById('timerStatusLabel');
      const bottomBar = document.getElementById('bottomTimerBar');
      if (disp) disp.textContent = formatTime(timerRemaining);
      if (bar) {
        const pct = timerTotal > 0 ? Math.max(0, Math.min(100, (timerRemaining / timerTotal) * 100)) : 0;
        bar.style.width = `${pct}%`;
      }
      if (lbl) {
        lbl.textContent = timerInterval ? 'Идет отдых...' : (timerRemaining === 0 ? '🔥 В ПОДХОД!' : 'Отдых');
        lbl.className = timerRemaining === 0 ? 'text-[11px] font-extrabold text-emerald-400 animate-pulse' : 'text-[11px] font-medium text-slate-400';
      }
      if (bottomBar) {
        if (timerRemaining === 0) {
          bottomBar.classList.add('border-emerald-500');
        } else {
          bottomBar.classList.remove('border-emerald-500');
        }
      }
    }

    function playBeep() {
      try {
        unlockAudio();
        const ctx = sharedAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.18, 0.36].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.14);
        });
      } catch (e) {}
    }

    function setTimerPreset(seconds, autoStart = true) {
      unlockAudio();
      timerTotal = seconds;
      timerRemaining = seconds;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (autoStart) {
        startTimer();
      } else {
        updateTimerUI();
      }
    }

    function adjustTimer(delta) {
      unlockAudio();
      timerRemaining = Math.max(0, timerRemaining + delta);
      timerTotal = Math.max(timerTotal, timerRemaining);
      if (timerInterval && timerEndTime) {
        timerEndTime += delta * 1000;
      }
      updateTimerUI();
    }

    // Используем реальные метки времени (Date.now()), чтобы таймер на iPhone не отставал даже при блокировке экрана!
    function startTimer() {
      if (timerRemaining <= 0) timerRemaining = timerTotal;
      timerEndTime = Date.now() + timerRemaining * 1000;
      timerInterval = setInterval(() => {
        const left = Math.round((timerEndTime - Date.now()) / 1000);
        if (left <= 0) {
          timerRemaining = 0;
          clearInterval(timerInterval);
          timerInterval = null;
          timerEndTime = null;
          playBeep();
        } else {
          timerRemaining = left;
        }
        updateTimerUI();
      }, 500);
      updateTimerUI();
    }

    function toggleTimer() {
      unlockAudio();
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerEndTime = null;
        updateTimerUI();
      } else {
        startTimer();
      }
    }

    // ==========================================
    // 8. ЭКСПОРТ CSV / JSON БЭКАП
    // ==========================================
    function openDataModal() {
      document.getElementById('dataModal').classList.remove('hidden');
    }

    function closeDataModal() {
      document.getElementById('dataModal').classList.add('hidden');
    }

    function forceAppUpdate() {
      saveState();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          Promise.all(regs.map(r => r.unregister())).then(() => {
            window.location.reload(true);
          });
        });
      } else {
        window.location.reload(true);
      }
    }

    function exportCSV() {
      const rows = [['Неделя', 'День', 'Упражнение', 'Подход', 'Вес (кг)', 'Повторы', 'Выполнено', 'Заметка']];
      for (let w = 1; w <= 16; w++) {
        Object.values(PROGRAM).forEach(day => {
          day.exercises.forEach(ex => {
            const note = state.notes[`w${w}_${ex.id}`] || '';
            for (let s = 1; s <= ex.sets; s++) {
              const d = getSetData(w, ex.id, s);
              if (d.weight !== '' || d.reps !== '' || note !== '') {
                rows.push([
                  w,
                  day.title,
                  ex.name,
                  s,
                  d.weight,
                  d.reps,
                  d.done ? 'Да' : 'Нет',
                  note
                ]);
              }
            }
          });
        });
      }
      const csvContent = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `GYM738_Workouts_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `GYM738_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          state = Object.assign(getDefaultState(), parsed);
          saveState();
          initWeekSelect();
          render();
          closeDataModal();
        } catch (err) {
          alert('Ошибка чтения файла бэкапа');
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      if (confirm('Точно очистить все записанные веса и повторы?')) {
        localStorage.removeItem(STORAGE_KEY);
        openIDB().then(db => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(STORAGE_KEY);
        }).catch(() => {});
        state = getDefaultState();
        initWeekSelect();
        render();
        closeDataModal();
      }
    }

    // Boot
    initWeekSelect();
    render();
    updateTimerUI();
    restoreFromIDBIfNeeded();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update().catch(() => {});
      }).catch(() => {});
    }
  </script>
</body>
