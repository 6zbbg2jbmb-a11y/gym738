<!DOCTYPE html>
<html lang="ru" class="dark">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GYM738" />
  <meta name="theme-color" content="#090d16" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>GYM738 — Дневник тренировок (Upper / Lower)</title>
  <script src="tailwind.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overscroll-behavior-y: none;
    }
    body {
      /* Запас снизу под плавающий таймер + полоску Home Indicator на iPhone 14 */
      padding-bottom: calc(7.5rem + max(var(--safe-bottom), 20px));
    }

    /* Шапка с учетом «брови» / Dynamic Island на iPhone 14 (47px–59px) */
    .ios-header {
      padding-top: max(calc(var(--safe-top) + 8px), 14px);
    }
    @media all and (display-mode: standalone) {
      .ios-header {
        /* Гарантированный отступ под бровь iPhone 14 даже если env() при холодном старте = 0 */
        padding-top: max(calc(var(--safe-top) + 8px), 52px);
      }
    }

    /* Нижний бар таймера с учетом полоски Home Indicator на iPhone 14 */
    .ios-bottom-bar {
      padding-bottom: max(calc(var(--safe-bottom) + 6px), 14px);
    }
    @media all and (display-mode: standalone) {
      .ios-bottom-bar {
        padding-bottom: max(calc(var(--safe-bottom) + 4px), 28px);
      }
    }

    /* Важно для iOS: шрифт 16px в полях ввода отключает авто-зум экрана при нажатии на Айфоне */
    input, select, textarea {
      font-size: 16px !important;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .set-done {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.16) 0%, rgba(16, 185, 129, 0.05) 100%);
      border-color: rgba(16, 185, 129, 0.4) !important;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-slate-950">

  <!-- Top Sticky Header (адаптирован под бровь iPhone 14) -->

          Пн: Верх А
        </button>

        </button>

          Чт: Верх Б
        </button>
        <button onclick="selectTab('lowerB')" id="tab-lowerB" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
          Пт: Низ Б
        </button>
        <button onclick="selectTab('nutrition')" id="tab-nutrition" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
          ⚖️ Вес и КБЖУ
        </button>
        <button onclick="selectTab('stats')" id="tab-stats" class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
          📈 Сводка
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-lg mx-auto px-3.5 pt-3" id="mainContainer">
  </main>

  <!-- Floating Bottom Rest Timer Bar (с учетом полоски Home на iPhone 14) -->

        </button>

      </div>

      <!-- Quick preset buttons + Dismiss Keyboard button -->
      <div class="flex items-center gap-1">
        <button onclick="setTimerPreset(90)" class="px-2 py-2 rounded-xl bg-slate-800 active:bg-slate-700 text-[11px] font-semibold text-slate-300 active:scale-95">1:30</button>

  <!-- Data / Backup / Export Modal -->
  <div id="dataModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

      </div>
      <p class="text-xs text-slate-400 leading-relaxed">

      </p>
      <div class="grid grid-cols-1 gap-2.5">
        <button onclick="exportCSV()" class="w-full py-3 px-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-bold active:scale-98 transition flex items-center justify-center gap-2">

          💾 Сохранить файл бэкапа (.JSON) на Айфон
        </button>

          📂 Восстановить из бэкапа (.JSON)

      </div>
    </div>

    // ==========================================
    // 2. СОСТОЯНИЕ И ДВОЙНОЕ ХРАНИЛИЩЕ (LOCALSTORAGE + INDEXEDDB)
    // ==========================================
    // Ключи хранилища неизменны — все введенные ранее данные полностью сохраняются!
    const STORAGE_KEY = 'gym738_tracker_v1';
    const IDB_NAME = 'gym738_idb';
    const IDB_STORE = 'state_store';
    let state = loadState();

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    function openIDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject('No IDB');
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e);
      });
    }

    function saveToIDB(data) {
      openIDB().then(db => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(JSON.stringify(data), STORAGE_KEY);
      }).catch(() => {});
    }

    function restoreFromIDBIfNeeded() {
      openIDB().then(db => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
        req.onsuccess = () => {
          if (req.result && !localStorage.getItem(STORAGE_KEY)) {
            try {
              state = Object.assign(getDefaultState(), JSON.parse(req.result));
              localStorage.setItem(STORAGE_KEY, req.result);
              initWeekSelect();
              render();
            } catch (e) {}
          }
        };
      }).catch(() => {});
    }

    function getDefaultState() {
      return {
        currentWeek: 1,
        currentTab: 'upperA',
        selectedVariants: {},
        workouts: {},
        notes: {},
        bodyWeight: {},
        dailyChecklist: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        return Object.assign(getDefaultState(), JSON.parse(raw));
      } catch (e) {
        return getDefaultState();
      }
    }

    let saveFlashTimeout = null;
    function saveState() {
      try {
        const serialized = JSON.stringify(state);
        localStorage.setItem(STORAGE_KEY, serialized);
        saveToIDB(state);
        const badge = document.getElementById('saveStatusBadge');
        if (badge) {
          badge.textContent = '💾 Сохранено';
          badge.className = 'px-1.5 py-0.5 rounded-md bg-emerald-500 text-slate-950 text-[10px] font-bold transition';
          clearTimeout(saveFlashTimeout);
          saveFlashTimeout = setTimeout(() => {
            badge.textContent = '✓ В памяти';
            badge.className = 'px-1.5 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-[10px] font-semibold text-emerald-400 transition';
          }, 900);
        }
      } catch (e) {
        console.error('Save error', e);
      }
      updateHeaderWeight();
    }

    function getSetData(week, exId, setIdx) {
      const key = `w${week}_${exId}_s${setIdx}`;
      return state.workouts[key] || { weight: '', reps: '', done: false };
    }

    function setSetData(week, exId, setIdx, patch) {
      const key = `w${week}_${exId}_s${setIdx}`;
      const current = getSetData(week, exId, setIdx);
      state.workouts[key] = Object.assign({}, current, patch);
      saveState();
    }

    function getRepRange(ex) {
      const variantIdx = state.selectedVariants[ex.id] || 0;
      if (ex.id === 'lb_main' && variantIdx === 1) {
        return { min: ex.altMinReps, max: ex.altMaxReps };
      }
      return { min: ex.minReps, max: ex.maxReps };
    }

    // ==========================================
    // 3. АЛГОРИТМ ДВОЙНОЙ ПРОГРЕССИИ
    // ==========================================
    function evaluateProgression(week, ex) {
      const range = getRepRange(ex);
      const isDeload = (week % 8 === 0);

      if (isDeload) {
        return {
          type: 'deload',
          badge: '🔄 DELOAD НЕДЕЛЯ (-15..20% веса)',
          color: 'text-sky-300 bg-sky-500/15 border-sky-500/30'
        };
      }

      let curSets = [];
      for (let s = 1; s <= ex.sets; s++) {
        curSets.push(getSetData(week, ex.id, s));
      }
      const filledCur = curSets.filter(s => s.reps !== '' && Number(s.reps) > 0);

      if (filledCur.length === ex.sets && filledCur.every(s => Number(s.reps) >= range.max)) {
        const w = Number(filledCur[0].weight) || 0;
        const nextW = w > 0 ? ` (${w + 2.5} кг)` : '';
        return {
          type: 'levelup',
          badge: `🚀 ВЕРХ ЗАКРЫТ! На след. неделе +вес${nextW}`,
          color: 'text-emerald-300 bg-emerald-500/20 border-emerald-500/40'
        };
      }

      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;
      if (prevWeek >= 1) {
        let prevSets = [];
        for (let s = 1; s <= ex.sets; s++) {
          prevSets.push(getSetData(prevWeek, ex.id, s));
        }
        const filledPrev = prevSets.filter(s => s.reps !== '' && Number(s.reps) > 0);
        if (filledPrev.length > 0) {
          const prevAllMax = filledPrev.length === ex.sets && filledPrev.every(s => Number(s.reps) >= range.max);
          const prevWeight = filledPrev[0].weight || '?';
          const prevRepsStr = prevSets.map(s => s.reps || '—').join(', ');

          if (prevAllMax) {
            const suggestedWeight = Number(prevWeight) ? (Number(prevWeight) + 2.5) : '';
            return {
              type: 'increase_weight_now',
              badge: `🔥 ПОВЫШАЙ ВЕС СЕГОДНЯ (${suggestedWeight ? suggestedWeight + ' кг' : '+2–2.5 кг'})`,
              color: 'text-amber-300 bg-amber-500/20 border-amber-500/40'
            };
          } else {
            return {
              type: 'add_rep',
              badge: `🎯 Цель: +1 повтор (Было: ${prevWeight} кг × ${prevRepsStr})`,
              color: 'text-indigo-300 bg-indigo-500/15 border-indigo-500/30'
            };
          }
        }
      }

      return {
        type: 'start',
        badge: `Двойная прогрессия: ${ex.sets} × ${range.min}–${range.max} (${ex.rir})`,
        color: 'text-slate-300 bg-slate-800/90 border-slate-700'
      };
    }

    // ==========================================
    // 4. РЕНДЕРИНГ ИНТЕРФЕЙСА ПОД IPHONE 14
    // ==========================================
    function initWeekSelect() {
      const sel = document.getElementById('weekSelect');
      sel.innerHTML = '';
      for (let w = 1; w <= 16; w++) {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = (w % 8 === 0) ? `Неделя ${w} (Deload)` : `Неделя ${w}`;
        if (w === Number(state.currentWeek)) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function changeWeek(val) {
      state.currentWeek = Number(val);
      saveState();
      render();
    }

    function selectTab(tabId) {
      state.currentTab = tabId;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectVariant(exId, idx) {
      state.selectedVariants[exId] = Number(idx);
      saveState();
      render();
    }

    function updateHeaderWeight() {
      const weights = Object.values(state.bodyWeight).filter(v => v && Number(v) > 0).map(Number);
      const el = document.getElementById('headerCurrentWeight');
      if (el) {
        el.textContent = weights.length > 0 ? weights[weights.length - 1].toFixed(1) : '73.0';
      }
    }

    function renderTabs() {
      const tabs = ['upperA', 'lowerA', 'upperB', 'lowerB', 'nutrition', 'stats'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (!btn) return;
        if (t === state.currentTab) {
          btn.className = 'tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 shadow-sm shadow-emerald-500/30 transition';
        } else {
          btn.className = 'tab-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-800/80 text-slate-300 active:bg-slate-700 border border-slate-700/70 transition';
        }
      });
    }

    function renderWorkoutDay(dayKey) {
      const day = PROGRAM[dayKey];
      const week = Number(state.currentWeek);
      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;

      let totalSets = 0;
      let doneSets = 0;
      let totalVolume = 0;
      day.exercises.forEach(ex => {
        for (let s = 1; s <= ex.sets; s++) {
          totalSets++;
          const d = getSetData(week, ex.id, s);
          if (d.done) doneSets++;
          if (d.weight && d.reps) {
            totalVolume += Number(d.weight) * Number(d.reps);
          }
        }
      });

      const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;

      let html = `
        <!-- Day Summary Card -->
        <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 mb-3.5 shadow-lg">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h2 class="text-base font-bold text-white leading-tight">${day.title}</h2>
              <p class="text-xs text-slate-400 mt-0.5">${day.subtitle}</p>
            </div>
            <div class="text-right shrink-0">
              <span class="text-xs font-mono font-bold text-emerald-400">${doneSets}/${totalSets} сетов</span>
              <div class="text-[11px] text-slate-400">Тоннаж: <b class="text-slate-200">${totalVolume.toLocaleString('ru-RU')} кг</b></div>
            </div>
          </div>
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-2.5">
            <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${pct}%"></div>
          </div>
          <p class="text-[11px] text-slate-400 mt-2 flex items-start gap-1.5 leading-snug">
            <span class="text-amber-400 shrink-0">⚡</span>
            <span>${day.warmupNote}</span>
          </p>
        </div>

        <div class="space-y-3.5">
      `;

      day.exercises.forEach((ex, idx) => {
        const range = getRepRange(ex);
        const prog = evaluateProgression(week, ex);
        const variantIdx = state.selectedVariants[ex.id] || 0;
        const displayName = ex.variants ? ex.variants[variantIdx] : ex.name;

        html += `
          <div class="bg-slate-900/95 border border-slate-800/90 rounded-2xl p-3.5 shadow-md" id="card-${ex.id}">
            <!-- Exercise Header -->
            <div class="flex items-start justify-between gap-2 mb-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-1.5 py-0.5 rounded-md bg-slate-800 text-[10px] font-bold text-emerald-400 border border-slate-700">#${idx + 1}</span>
                  <span class="text-[11px] font-medium text-slate-400">${ex.muscle}</span>
                  <span class="text-[11px] text-slate-500">•</span>
                  <button onclick="setTimerPreset(${ex.restSec}, true)" class="text-[11px] font-semibold text-sky-400 active:opacity-70 flex items-center gap-0.5">
                    ⏱ ${ex.restLabel}
                  </button>
                </div>
                <h3 class="text-[15px] font-bold text-white mt-1 leading-snug">${displayName}</h3>
              </div>
              <div class="text-right shrink-0">
                <span class="inline-block px-2 py-0.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-mono font-bold text-white">
                  ${ex.sets} × ${range.min}–${range.max}
                </span>
                <div class="text-[10px] font-semibold text-amber-400/90 mt-0.5">${ex.rir}</div>
              </div>
            </div>

            <!-- Variant Switcher -->
            ${ex.variants ? `
              <div class="flex gap-1 mb-2.5 bg-slate-950/80 p-1 rounded-xl border border-slate-800/80">
                ${ex.variants.map((v, vIdx) => `
                  <button onclick="selectVariant('${ex.id}', ${vIdx})" class="flex-1 py-1.5 px-2 rounded-lg text-[11px] font-medium transition truncate ${variantIdx === vIdx ? 'bg-slate-800 text-emerald-400 font-bold border border-slate-700' : 'text-slate-400'}">
                    ${v}
                  </button>
                `).join('')}
              </div>
            ` : ''}

            <!-- Biomechanics tip -->
            <p class="text-[11px] text-slate-400 leading-relaxed mb-2.5 bg-slate-950/50 px-2.5 py-1.5 rounded-xl border border-slate-800/60">
              💡 ${ex.note}
            </p>

            <!-- Double Progression Status Banner -->
            <div class="mb-2.5 px-3 py-2 rounded-xl border text-xs font-semibold flex items-center justify-between gap-2 ${prog.color}" id="prog-${ex.id}">
              <span>${prog.badge}</span>
            </div>

            <!-- Sets Table Header (адаптировано под 390px ширину iPhone 14) -->
            <div class="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400 px-1.5 mb-1">
              <div class="w-6 text-center">Сет</div>
              <div class="flex-1">Прошлый раз</div>
              <div class="w-[78px] text-center">Вес (кг)</div>
              <div class="w-[64px] text-center">Повт.</div>
              <div class="w-[44px] text-center">ОК</div>
            </div>

            <!-- Sets Rows -->
            <div class="space-y-2">
        `;

        for (let s = 1; s <= ex.sets; s++) {
          const cur = getSetData(week, ex.id, s);
          const prev = prevWeek >= 1 ? getSetData(prevWeek, ex.id, s) : { weight: '', reps: '' };
          const hasPrev = prev.weight !== '' || prev.reps !== '';
          const prevText = hasPrev ? `${prev.weight || 0} кг × ${prev.reps || 0}` : '—';

          const set1 = getSetData(week, ex.id, 1);
          const weightPlaceholder = prev.weight !== '' ? prev.weight : (set1.weight !== '' ? set1.weight : 'кг');
          const repsPlaceholder = prev.reps !== '' ? prev.reps : `${range.min}-${range.max}`;

          const isTopRep = cur.reps !== '' && Number(cur.reps) >= range.max;

          html += `
            <div id="row-${ex.id}-${s}" class="flex items-center gap-1.5 p-1.5 rounded-2xl border border-slate-800/90 bg-slate-950/70 transition ${cur.done ? 'set-done' : ''}">

              <div class="w-6 text-center font-mono text-xs font-extrabold ${cur.done ? 'text-emerald-400' : 'text-slate-400'}">

              <!-- Previous Week (Tap to autofill) -->
              <div class="flex-1 min-w-0">
                <button
                  type="button"
                  onclick="copyFromPrev(${week}, '${ex.id}', ${s}, '${prev.weight}', '${prev.reps}', ${ex.restSec})"
                  class="w-full h-10 text-left px-2.5 rounded-xl bg-slate-900/90 border border-slate-800/90 text-xs font-mono ${hasPrev ? 'text-slate-300 active:scale-95 active:border-emerald-500/50' : 'text-slate-600'} truncate transition flex items-center"
                >
                  ${prevText}
                </button>
              </div>

              <!-- Weight Input (16px font = no iOS zoom, 40px height) -->
              <div class="w-[78px]">
                <input
                  type="number"
                  step="0.5"
                  inputmode="decimal"
                  enterkeyhint="done"
                  placeholder="${weightPlaceholder}"
                  value="${cur.weight}"
                  oninput="onSetInput(${week}, '${ex.id}', ${s}, 'weight', this.value)"
                  onkeydown="if(event.key==='Enter') this.blur()"
                  class="w-full h-10 text-center font-mono font-bold bg-slate-900 border border-slate-700/90 rounded-xl px-1 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                />
              </div>

              <!-- Reps Input (16px font = no iOS zoom, 40px height) -->
              <div class="w-[64px]">
                <input
                  type="number"
                  step="1"
                  inputmode="numeric"
                  enterkeyhint="done"
                  placeholder="${repsPlaceholder}"
                  value="${cur.reps}"
                  oninput="onSetInput(${week}, '${ex.id}', ${s}, 'reps', this.value)"
                  onkeydown="if(event.key==='Enter') this.blur()"
                  class="w-full h-10 text-center font-mono font-bold bg-slate-900 border ${isTopRep ? 'border-emerald-500/70 text-emerald-300' : 'border-slate-700/90 text-white'} rounded-xl px-1 placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                />
              </div>

              <!-- Complete Set & Start Rest Timer Button (44x40px Apple HIG touch target) -->
              <div class="w-[44px]">
                <button
                  type="button"
                  onclick="toggleSetDone(${week}, '${ex.id}', ${s}, ${ex.restSec})"
                  class="w-full h-10 rounded-xl font-bold text-sm flex items-center justify-center transition active:scale-90 ${cur.done ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/25' : 'bg-slate-800 text-slate-400 border border-slate-700'}"
                >
                  ✓

            </div>
          `;
        }

        const noteKey = `w${week}_${ex.id}`;
        const curNote = state.notes[noteKey] || '';

        html += `
            </div>

            <!-- Quick Note Input -->
            <div class="mt-2.5">
              <input
                type="text"
                enterkeyhint="done"
                placeholder="Заметка (напр., высота сиденья, положение рукояти)..."
                value="${curNote.replace(/"/g, '&quot;')}"
                oninput="onNoteInput('${noteKey}', this.value)"
                onkeydown="if(event.key==='Enter') this.blur()"
                class="w-full bg-slate-950/40 rounded-xl px-3 py-2 border border-slate-800/80 focus:border-emerald-500/60 text-slate-200 placeholder-slate-600 focus:outline-none"
              />
            </div>
          </div>
        `;
      });

      html += `</div>`;
      document.getElementById('mainContainer').innerHTML = html;
    }

    function onSetInput(week, exId, setIdx, field, value) {
      setSetData(week, exId, setIdx, { [field]: value });
      const day = PROGRAM[state.currentTab];
      if (day) {
        const ex = day.exercises.find(e => e.id === exId);
        if (ex) {
          const prog = evaluateProgression(week, ex);
          const progEl = document.getElementById(`prog-${ex.id}`);
          if (progEl) {
            progEl.className = `mb-2.5 px-3 py-2 rounded-xl border text-xs font-semibold flex items-center justify-between gap-2 ${prog.color}`;
            progEl.innerHTML = `<span>${prog.badge}</span>`;
          }
        }
      }
    }

    function onNoteInput(noteKey, value) {
      state.notes[noteKey] = value;
      saveState();
    }

    function copyFromPrev(week, exId, setIdx, prevWeight, prevReps, restSec) {
      if (!prevWeight && !prevReps) return;
      const cur = getSetData(week, exId, setIdx);
      setSetData(week, exId, setIdx, {
        weight: cur.weight !== '' ? cur.weight : prevWeight,
        reps: cur.reps !== '' ? cur.reps : prevReps
      });
      render();
    }

    function toggleSetDone(week, exId, setIdx, restSec) {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        document.activeElement.blur();
      }
      const cur = getSetData(week, exId, setIdx);
      const prevWeek = (week > 1 && (week - 1) % 8 === 0 && week > 2) ? week - 2 : week - 1;
      const prev = prevWeek >= 1 ? getSetData(prevWeek, exId, setIdx) : { weight: '', reps: '' };
      const set1 = getSetData(week, exId, 1);

      let nextWeight = cur.weight;
      let nextReps = cur.reps;

      if (nextWeight === '') {
        if (set1.weight !== '') nextWeight = set1.weight;
        else if (prev.weight !== '') nextWeight = prev.weight;
      }
      if (nextReps === '' && prev.reps !== '') {
        nextReps = prev.reps;
      }

      const nextDone = !cur.done;
      setSetData(week, exId, setIdx, {
        weight: nextWeight,
        reps: nextReps,
        done: nextDone
      });

      if (nextDone) {
        setTimerPreset(restSec, true);
      }
      render();
    }

    // ==========================================
    // 5. ВКЛАДКА: ВЕС ТЕЛА И ПИТАНИЕ
    // ==========================================
    function renderNutrition() {
      const week = Number(state.currentWeek);
      const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

      const curWeights = [];
      const prevWeights = [];
      for (let d = 1; d <= 7; d++) {
        const cw = Number(state.bodyWeight[`w${week}_d${d}`]);
        if (cw > 0) curWeights.push(cw);
        if (week > 1) {
          const pw = Number(state.bodyWeight[`w${week - 1}_d${d}`]);
          if (pw > 0) prevWeights.push(pw);
        }
      }

      const curAvg = curWeights.length ? (curWeights.reduce((a, b) => a + b, 0) / curWeights.length) : null;
      const prevAvg = prevWeights.length ? (prevWeights.reduce((a, b) => a + b, 0) / prevWeights.length) : null;
      const diff = (curAvg !== null && prevAvg !== null) ? (curAvg - prevAvg) : null;

      let diffBadge = '<span class="text-slate-400">Вноси утренний вес натощак</span>';
      if (diff !== null) {
        if (diff >= 0.2 && diff <= 0.45) {
          diffBadge = `<span class="text-emerald-400 font-bold">+${diff.toFixed(2)} кг за неделю (Идеальный Lean Bulk ✅)</span>`;
        } else if (diff < 0.2) {
          diffBadge = `<span class="text-amber-400 font-bold">${diff >= 0 ? '+' : ''}${diff.toFixed(2)} кг (Мало! Добавь +250 ккал углеводами 🍚)</span>`;
        } else {
          diffBadge = `<span class="text-rose-400 font-bold">+${diff.toFixed(2)} кг (Слишком быстро, чуть урежь профицит)</span>`;
        }
      }

      const todayKey = new Date().toISOString().slice(0, 10);
      const todayChecks = state.dailyChecklist[todayKey] || { kcal: false, protein: false, creatine: false, shake: false };

      let html = `
        <div class="space-y-3.5">
          <!-- Daily Checklist Card -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-bold text-white">Чек-лист на день (183 см / 73 кг)</h2>
              <span class="text-[11px] font-mono text-slate-400">${todayKey}</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="toggleDailyCheck('${todayKey}', 'kcal')" class="p-3 rounded-2xl border text-left transition active:scale-95 ${todayChecks.kcal ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300'}">
                <div class="text-xs font-bold flex items-center justify-between">
                  <span>🔥 2950 ккал</span>
                  <span>${todayChecks.kcal ? '✅' : '⬜'}</span>
                </div>
                <div class="text-[10px] text-slate-400 mt-1">Профицит +350 ккал</div>
              </button>

              <button onclick="toggleDailyCheck('${todayKey}', 'protein')" class="p-3 rounded-2xl border text-left transition active:scale-95 ${todayChecks.protein ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300'}">
                <div class="text-xs font-bold flex items-center justify-between">
                  <span>🥩 135 г белка</span>
                  <span>${todayChecks.protein ? '✅' : '⬜'}</span>
                </div>
                <div class="text-[10px] text-slate-400 mt-1">120–145 г в сутки</div>
              </button>

              <button onclick="toggleDailyCheck('${todayKey}', 'creatine')" class="p-3 rounded-2xl border text-left transition active:scale-95 ${todayChecks.creatine ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300'}">
                <div class="text-xs font-bold flex items-center justify-between">
                  <span>⚡ Креатин 5 г</span>
                  <span>${todayChecks.creatine ? '✅' : '⬜'}</span>
                </div>
                <div class="text-[10px] text-slate-400 mt-1">Моногидрат ежедневно</div>
              </button>

              <button onclick="toggleDailyCheck('${todayKey}', 'shake')" class="p-3 rounded-2xl border text-left transition active:scale-95 ${todayChecks.shake ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300'}">
                <div class="text-xs font-bold flex items-center justify-between">
                  <span>🥤 Шейк 750 ккал</span>
                  <span>${todayChecks.shake ? '✅' : '⬜'}</span>
                </div>
                <div class="text-[10px] text-slate-400 mt-1">Молоко+банан+овсянка</div>
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 mt-3.5 pt-3 border-t border-slate-800/80 text-center">
              <div class="bg-slate-950/80 rounded-xl p-2 border border-slate-800">
                <div class="text-[10px] text-slate-400">Белки</div>
                <div class="text-xs font-bold text-emerald-400 mt-0.5">120–145 г</div>
              </div>
              <div class="bg-slate-950/80 rounded-xl p-2 border border-slate-800">
                <div class="text-[10px] text-slate-400">Жиры</div>
                <div class="text-xs font-bold text-amber-400 mt-0.5">75–85 г</div>
              </div>
              <div class="bg-slate-950/80 rounded-xl p-2 border border-slate-800">
                <div class="text-[10px] text-slate-400">Углеводы</div>
                <div class="text-xs font-bold text-sky-400 mt-0.5">400–430 г</div>
              </div>
            </div>
          </div>

          <!-- Morning Body Weight Tracker -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <div class="flex items-center justify-between mb-1">
              <h2 class="text-sm font-bold text-white">Утренний вес — Неделя ${week}</h2>
              <span class="text-xs font-mono font-bold text-emerald-400">
                Средний: ${curAvg !== null ? curAvg.toFixed(2) + ' кг' : '—'}
              </span>
            </div>
            <p class="text-xs mb-3">${diffBadge}</p>

            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
              ${days.map((dName, idx) => {
                const dIdx = idx + 1;
                const val = state.bodyWeight[`w${week}_d${dIdx}`] || '';
                return `
                  <div class="bg-slate-950/70 p-2 rounded-xl border border-slate-800/80 text-center">
                    <div class="text-[10px] text-slate-400 mb-1 font-semibold">${dName}</div>
                    <input
                      type="number"
                      step="0.1"
                      inputmode="decimal"
                      enterkeyhint="done"
                      placeholder="73.0"
                      value="${val}"
                      oninput="onBodyWeightInput(${week}, ${dIdx}, this.value)"
                      onkeydown="if(event.key==='Enter') this.blur()"
                      class="w-full text-center font-mono font-bold bg-slate-900 border border-slate-700/80 rounded-lg py-1.5 text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('mainContainer').innerHTML = html;
    }

    function toggleDailyCheck(dateKey, field) {
      const cur = state.dailyChecklist[dateKey] || { kcal: false, protein: false, creatine: false, shake: false };
      cur[field] = !cur[field];
      state.dailyChecklist[dateKey] = cur;
      saveState();
      render();
    }

    function onBodyWeightInput(week, dayIdx, val) {
      state.bodyWeight[`w${week}_d${dayIdx}`] = val;
      saveState();
    }

    // ==========================================
    // 6. ВКЛАДКА: СВОДКА И ПРОГРЕСС ПО НЕДЕЛЯМ
    // ==========================================
    function renderStats() {
      let html = `
        <div class="space-y-3">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <h2 class="text-sm font-bold text-white mb-1">Сводка рабочих весов (Недели 1–8)</h2>
            <p class="text-xs text-slate-400 mb-3">Лучший сет (Вес × Повторы) по неделям:</p>
            <div class="overflow-x-auto no-scrollbar">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b border-slate-800 text-slate-400">
                    <th class="py-2 pr-2">Упражнение</th>
                    ${[1,2,3,4,5,6,7,8].map(w => `<th class="py-2 px-1.5 text-center font-mono">Н${w}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
      `;

      Object.values(PROGRAM).forEach(day => {
        html += `
          <tr class="bg-slate-950/60">
            <td colspan="9" class="py-2 px-2 font-bold text-emerald-400 text-xs">${day.title}</td>
          </tr>
        `;
        day.exercises.forEach(ex => {
          html += `<tr><td class="py-2 pr-2 text-slate-200 font-medium max-w-[130px] truncate">${ex.name}</td>`;
          for (let w = 1; w <= 8; w++) {
            let best = '—';
            let bestScore = -1;
            for (let s = 1; s <= ex.sets; s++) {
              const d = getSetData(w, ex.id, s);
              if (d.weight !== '' || d.reps !== '') {
                const score = (Number(d.weight) || 1) * (Number(d.reps) || 0);
                if (score > bestScore) {
                  bestScore = score;
                  best = `${d.weight || 0}×${d.reps || 0}`;
                }
              }
            }
            html += `<td class="py-2 px-1 text-center font-mono ${best !== '—' ? 'text-white font-semibold' : 'text-slate-600'}">${best}</td>`;
          }
          html += `</tr>`;
        });
      });

      html += `
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mainContainer').innerHTML = html;
    }

    function render() {
      renderTabs();
      if (state.currentTab === 'nutrition') {
        renderNutrition();
      } else if (state.currentTab === 'stats') {
        renderStats();
      } else {
        renderWorkoutDay(state.currentTab);
      }
      updateHeaderWeight();
    }

    // ==========================================
    // 7. ТАЙМЕР ОТДЫХА СО ЗВУКОМ
    // ==========================================
    let timerTotal = 150;
    let timerRemaining = 150;
    let timerInterval = null;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      const disp = document.getElementById('timerDisplay');
      const bar = document.getElementById('timerProgressBar');
      const lbl = document.getElementById('timerStatusLabel');
      if (disp) disp.textContent = formatTime(timerRemaining);
      if (bar) {
        const pct = timerTotal > 0 ? Math.max(0, Math.min(100, (timerRemaining / timerTotal) * 100)) : 0;
        bar.style.width = `${pct}%`;
      }
      if (lbl) {
        lbl.textContent = timerInterval ? 'Отдых...' : (timerRemaining === 0 ? '🔥 В ПОДХОД!' : 'Отдых');
        lbl.className = timerRemaining === 0 ? 'text-[11px] font-bold text-emerald-400 animate-pulse' : 'text-[11px] text-slate-400';
      }
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.2, 0.4].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.25, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.15);
        });
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } catch (e) {}
    }

    function setTimerPreset(seconds, autoStart = true) {
      timerTotal = seconds;
      timerRemaining = seconds;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (autoStart) {
        startTimer();
      } else {
        updateTimerUI();
      }
    }

    function adjustTimer(delta) {
      timerRemaining = Math.max(0, timerRemaining + delta);
      timerTotal = Math.max(timerTotal, timerRemaining);
      updateTimerUI();
    }

    function startTimer() {
      if (timerRemaining <= 0) timerRemaining = timerTotal;
      timerInterval = setInterval(() => {
        timerRemaining--;
        if (timerRemaining <= 0) {
          timerRemaining = 0;
          clearInterval(timerInterval);
          timerInterval = null;
          playBeep();
        }
        updateTimerUI();
      }, 1000);
      updateTimerUI();
    }

    function toggleTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        updateTimerUI();
      } else {
        startTimer();
      }
    }

    // ==========================================
    // 8. ЭКСПОРТ CSV / JSON БЭКАП И ОБНОВЛЕНИЕ
    // ==========================================
    function openDataModal() {
      document.getElementById('dataModal').classList.remove('hidden');
    }

    function closeDataModal() {
      document.getElementById('dataModal').classList.add('hidden');
    }

    function forceAppUpdate() {
      saveState();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          Promise.all(regs.map(r => r.unregister())).then(() => {
            window.location.reload(true);
          });
        });
      } else {
        window.location.reload(true);
      }
    }

    function exportCSV() {
      const rows = [['Неделя', 'День', 'Упражнение', 'Подход', 'Вес (кг)', 'Повторы', 'Выполнено', 'Заметка']];
      for (let w = 1; w <= 16; w++) {
        Object.values(PROGRAM).forEach(day => {
          day.exercises.forEach(ex => {
            const note = state.notes[`w${w}_${ex.id}`] || '';
            for (let s = 1; s <= ex.sets; s++) {
              const d = getSetData(w, ex.id, s);
              if (d.weight !== '' || d.reps !== '' || note !== '') {
                rows.push([
                  w,
                  day.title,
                  ex.name,
                  s,
                  d.weight,
                  d.reps,
                  d.done ? 'Да' : 'Нет',
                  note
                ]);
              }
            }
          });
        });
      }
      const csvContent = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `GYM738_Workouts_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `GYM738_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          state = Object.assign(getDefaultState(), parsed);
          saveState();
          initWeekSelect();
          render();
          closeDataModal();
        } catch (err) {
          alert('Ошибка чтения файла бэкапа');
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      if (confirm('Точно очистить все записанные веса и повторы?')) {
        localStorage.removeItem(STORAGE_KEY);
        openIDB().then(db => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(STORAGE_KEY);
        }).catch(() => {});
        state = getDefaultState();
        initWeekSelect();
        render();
        closeDataModal();
      }
    }

    // Boot
    initWeekSelect();
    render();
    updateTimerUI();
    restoreFromIDBIfNeeded();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update().catch(() => {});
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                window.location.reload();
              }
            });
          }
        });
      }).catch(() => {});
    }
  </script>
